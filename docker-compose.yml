version: '3.8'

services:
  # LinkedIn API Service
  api:
    build: .
    container_name: linkedin-api
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      - CHROME_BIN=/usr/bin/chromium
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - DISPLAY=:99
      - DB_HOST=linkedin-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=linkedin
    shm_size: '2g'
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped
    depends_on:
      - linkedin-db
    networks:
      - linkedin-network

  # n8n Workflow Automation Service
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_custom_nodes:/home/node/.n8n/custom
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - linkedin-network

  # PostgreSQL Database Service
  linkedin-db:
    image: postgres:15
    container_name: linkedin-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linkedin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - linkedin-network

volumes:
  n8n_data:
    driver: local
  postgres_data:
    driver: local

networks:
  linkedin-network:
    driver: bridge

