services:
  # LinkedIn API Service
  api:
    build: .
    container_name: linkedin-api
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      - CHROME_BIN=/usr/bin/chromium
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - DISPLAY=:99
      - HEADLESS=true
      - DB_HOST=${DB_HOST:-linkedin-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-linkedin}
    volumes:
      - browser_data:/usr/src/app/.browser-data
    shm_size: '2g'
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped
    depends_on:
      linkedin-db:
        condition: service_healthy
    profiles:
      - production
    networks:
      - linkedin-network

  # n8n Workflow Automation Service
  n8n:
    build:
      dockerfile: ./Dockerfile.patched.n8n
    container_name: n8n
    ports:
      - "${N8N_PORT}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true # Allow AI nodes to use custom linkedin nodes as tool
      - N8N_TRUST_PROXY=${N8N_PROXY:-}
      - NODE_ENV=production
      - NODE_FUNCTION_ALLOW_EXTERNAL=${EXTERNAL:-'uuid,cheerio'}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-${N8N_PROTOCOL:-http}://${N8N_HOST:-localhost}:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Paris}
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_custom_nodes:/home/node/.n8n/custom
    profiles:
      - development
      - production
    restart: unless-stopped
    networks:
      - linkedin-network

  # PostgreSQL Database Service
  linkedin-db:
    image: postgres:15
    container_name: linkedin-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linkedin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - production
      - development
    networks:
      - linkedin-network

  # Prometheus Monitoring Service
  prometheus:
    image: prom/prometheus:latest
    container_name: linkedin-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    profiles:
      - monitoring
      - development
      - production
    networks:
      - linkedin-network
    depends_on:
      - api

  # Grafana Visualization Service
  grafana:
    image: grafana/grafana:latest
    container_name: linkedin-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3001:3000"
    restart: unless-stopped
    profiles:
      - monitoring
      - development
      - production
    networks:
      - linkedin-network
    depends_on:
      - prometheus

volumes:
  n8n_data:
    driver: local
  postgres_data:
    driver: local
  browser_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  linkedin-network:
    driver: bridge

