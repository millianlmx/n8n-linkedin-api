global:
  scrape_interval: 15s # Scrape metrics every 15 seconds
  evaluation_interval: 15s # Evaluate rules every 15 seconds
  external_labels:
    monitor: 'linkedin-api-monitor'

# Scrape configurations
scrape_configs:
  # LinkedIn API metrics
  - job_name: 'linkedin-api'
    static_configs:
      - targets: ['api:8080'] # Docker service name and port
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
